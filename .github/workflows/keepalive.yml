# Keeps the free Supabase project from pausing after a week of inactivity.
# Save this in your repo as: .github/workflows/keepalive.yml
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 2 */3 * *'   # every 3 days at 02:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one card
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_9L0C25-K6bmQEcxp4_JPXg_eSY3-T_D" \
            "https://igjofxvporhezfwkhymj.supabase.co/rest/v1/cards?select=username&limit=1")
          echo "Supabase answered: $code"
          test "$code" = "200"
